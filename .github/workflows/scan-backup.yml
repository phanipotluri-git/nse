name: Scan Backup Trigger

on:
  schedule:
    - cron: '30 1 * * 6'   # 01:30 UTC Saturday (7:00 AM IST) — backup if main cron is skipped

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push scan trigger
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          echo "$(date -u +'%Y-%m-%d %H:%M UTC')" > data/.scan-trigger
          git add data/.scan-trigger
          git diff --staged --quiet && echo "No change, skipping" && exit 0
          git commit -m "chore: trigger weekly scan $(date -u +'%d %b %Y')"
          git push origin main
